<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <link rel="stylesheet" href="../css/tokens.css">
    <link rel="stylesheet" href="../css/links.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Welcome</h1>
            <p class="subtitle">Quick access to the daily tools.</p>
        </header>
        
        <div id="links-grid" class="grid">
            </div>
    </div>

    <div class="cookie-note" id="cookie-note" role="status" aria-live="polite">
        <span>This site uses one cookie to remember your consent choice.</span>
        <button type="button" id="cookie-note-accept" aria-label="Accept cookies">Accept</button>
    </div>

    <script>
        const myWebsites = [
            { name: "GitHub", url: "https://github.com/curryp0mmes" },
            { name: "Gitlab", url: "https://gitlab2.informatik.uni-wuerzburg.de/dashboard/projects" },
            { name: "Gmail", url: "https://mail.google.com" },
            { name: "Maps", url: "https://maps.google.com" },
            { name: "Gemini", url: "https://gemini.google.com" },
            { name: "NotebookLM", url: "https://notebooklm.google.com" },
            { name: "WueStudy", url: "https://wuestudy.zv.uni-wuerzburg.de/" },
            { name: "WueCampus", url: "https://wuecampus.uni-wuerzburg.de/moodle/login/index.php" },
            { name: "WueSpace", url: "https://go.wuespace.de/" },
            { name: "Habitica", url: "https://habitica.com/" },
            { name: "Typst", url: "https://typst.app/app/" }
        ];

        const grid = document.getElementById('links-grid');

        function renderLinks() {
            myWebsites.forEach(site => {
                const card = document.createElement('a');
                card.href = site.url;
                card.className = 'link-card';
                card.target = "_blank";
                card.rel = "noopener noreferrer";
                card.setAttribute('aria-label', site.name);
                const iconUrl = `https://www.google.com/s2/favicons?sz=128&domain=${site.url}`;

                card.innerHTML = `
                    <div class="icon-wrapper">
                        <img src="${iconUrl}" alt="${site.name} icon" loading="lazy" referrerpolicy="no-referrer">
                    </div>
                    <span>${site.name}</span>
                `;

                grid.appendChild(card);
            });
        }

        renderLinks();

        const cookieNote = document.getElementById('cookie-note');
        const acceptCookieNote = document.getElementById('cookie-note-accept');

        function hasAcceptedCookies() {
            return document.cookie.split('; ').some((entry) => entry.startsWith('cookie_consent=accepted'));
        }

        function setCookieConsent() {
            const maxAge = 60 * 60 * 24 * 365;
            document.cookie = `cookie_consent=accepted; path=/; max-age=${maxAge}; SameSite=Lax`;
        }

        if (!hasAcceptedCookies()) {
            requestAnimationFrame(() => cookieNote.classList.add('is-visible'));
        }

        acceptCookieNote.addEventListener('click', () => {
            setCookieConsent();
            cookieNote.classList.remove('is-visible');
        });
    </script>
</body>
</html>

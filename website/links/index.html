<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/tokens.css">
    <link rel="stylesheet" href="../css/links.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Welcome</h1>
            <p class="subtitle">Quick access to the daily tools.</p>
        </header>
        
        <div id="links-grid" class="grid">
            </div>
    </div>

    <script>
        // 1. YOUR ARRAY OF WEBSITES
        const myWebsites = [
            { name: "GitHub", url: "https://github.com/curryp0mmes" },
            { name: "Gitlab", url: "https://gitlab2.informatik.uni-wuerzburg.de/dashboard/projects" },
            { name: "Gmail", url: "https://mail.google.com" },
            { name: "Maps", url: "https://maps.google.com" },
            { name: "Gemini", url: "https://gemini.google.com" },
            { name: "NotebookLM", url: "https://notebooklm.google.com" },
            { name: "WueStudy", url: "https://wuestudy.zv.uni-wuerzburg.de/" },
            { name: "WueCampus", url: "https://wuecampus.uni-wuerzburg.de/moodle/login/index.php" },
            { name: "WueSpace", url: "https://go.wuespace.de/" },
            { name: "Habitica", url: "https://habitica.com/" },
            { name: "Typst", url: "https://typst.app/app/" }
        ];

        const grid = document.getElementById('links-grid');

        function renderLinks() {
            myWebsites.forEach(site => {
                const card = document.createElement('a');
                card.href = site.url;
                card.className = 'link-card';
                card.target = "_blank";
                card.rel = "noopener noreferrer";

                // Google S2 Favicon Service
                // Format: https://www.google.com/s2/favicons?sz=64&domain=URL
                const iconUrl = `https://www.google.com/s2/favicons?sz=128&domain=${site.url}`;

                card.innerHTML = `
                    <div class="icon-wrapper">
                        <img src="${iconUrl}" alt="${site.name} icon">
                    </div>
                    <span>${site.name}</span>
                `;

                grid.appendChild(card);
            });
        }

        renderLinks();
    </script>
</body>
</html>
